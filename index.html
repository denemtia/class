<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY LAB — 웹앱 놀이터</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--board:#2f5d48;--chalk:#f3f2e6;--wood:#a9744a;--pen:#f3f2e6}
*{box-sizing:border-box;margin:0}
body{background:#efe6d3;min-height:100vh;padding:clamp(10px,3vw,36px);font-family:Gaegu,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--chalk);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
/* 칠판 */
.board{flex:1;position:relative;border:16px solid var(--wood);border-image:linear-gradient(#b98356,#8d5c36) 1;box-shadow:0 14px 30px #5a40222e,inset 0 0 60px #0004;
  background:radial-gradient(40% 30% at 20% 30%,#ffffff10,transparent),radial-gradient(50% 40% at 75% 65%,#ffffff0c,transparent),var(--board);
  padding:clamp(16px,3vw,36px);display:flex;flex-direction:column;gap:22px}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.board>*:not(canvas){position:relative}
.chalk{text-shadow:0 0 1px #fff8,1px 1px 0 #fff2;opacity:.93}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;pointer-events:none}
.top a,.top button{pointer-events:auto}
.logo{font-size:22px;font-weight:700;letter-spacing:.06em}
.side{border:2px solid #f3f2e699;border-radius:4px 7px 5px 8px;padding:8px 14px;font-size:18px;line-height:1.5;text-align:right}
.links{display:flex;flex-wrap:wrap;gap:16px;font-size:18px;margin-top:6px;justify-content:flex-end}
.links *{text-decoration:underline wavy #f3f2e677;text-underline-offset:4px}
h1{font-size:clamp(34px,6vw,64px);line-height:1.1;pointer-events:none}
h1 u{text-decoration:underline wavy #f6dc7a;text-underline-offset:8px;color:#f6dc7a}
.sub{font-size:20px;opacity:.8;pointer-events:none;margin-top:8px}
/* 자석으로 붙인 종이 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 22px;margin-top:8px}
.card{background:#fff;background:linear-gradient(#fff,color-mix(in srgb,var(--c) 22%,#fff));color:#333;padding:22px 12px 12px;border-radius:2px;box-shadow:2px 4px 8px #0005;
  display:flex;flex-direction:column;gap:4px;text-align:center;position:relative;transition:.2s;rotate:1.5deg}
.card:nth-child(3n){rotate:-2deg}.card:nth-child(4n+2){rotate:-.8deg}.card:nth-child(5n){rotate:2.4deg}
.card::before{content:"";position:absolute;top:-9px;left:50%;translate:-50%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,transparent 40%),var(--c);box-shadow:0 2px 3px #0006;filter:saturate(1.6) brightness(.9)}
.card:hover,.card:focus-visible{rotate:0deg;translate:0 -6px;box-shadow:4px 12px 18px #0007;outline:0}
.card .no{position:absolute;left:8px;top:6px;font-size:14px;color:#999}
.card .em{font-size:52px;line-height:1.3}
.card b{font-size:20px}.card small{font-size:13px;letter-spacing:.1em;color:#888;font-family:Arial,sans-serif}
.hint{margin-top:auto;font-size:17px;opacity:.6;pointer-events:none}
/* 분필 받침 */
.tray{height:26px;background:linear-gradient(#c08a5c,#8d5c36);margin:0 -6px;border-radius:0 0 4px 4px;box-shadow:0 6px 10px #0003;display:flex;align-items:flex-end;gap:10px;padding:0 5%}
.stick{width:54px;height:11px;border-radius:3px;background:var(--k);margin-bottom:22px;box-shadow:0 2px 2px #0004;transition:.15s}
.stick:hover{translate:0 -3px}.stick[aria-pressed=true]{translate:0 -6px;outline:2px solid #fff;outline-offset:2px}
.eraser{margin:0 0 20px auto;background:linear-gradient(#3b4a8a 0 45%,#e8e2d0 45%);color:#fff;font-size:13px;width:92px;height:28px;border-radius:3px;line-height:12px;padding-bottom:14px;box-shadow:0 2px 3px #0005;font-family:Arial,sans-serif}
/* 상세: 작은 칠판 */
dialog{margin:auto;width:min(620px,92vw);border:12px solid var(--wood);border-image:linear-gradient(#b98356,#8d5c36) 1;background:var(--board);color:var(--chalk);padding:28px;box-shadow:0 30px 80px #0008;font-family:inherit}
dialog::backdrop{background:#2a1e1288;backdrop-filter:blur(4px)}
.d-head{display:flex;justify-content:space-between;font-size:17px;opacity:.7}
.d-main{display:flex;gap:20px;align-items:center;margin:14px 0}
.d-main .em{font-size:84px;border:2px dashed #f3f2e688;border-radius:10px;padding:6px 16px}
dialog h2{font-size:38px;color:#f6dc7a}
dialog p{font-size:21px;line-height:1.5;margin:8px 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{border:1.5px solid #f3f2e699;border-radius:99px;padding:2px 12px;font-size:16px}
.open{display:block;margin:22px 0 16px;background:#fffbe6;color:#333;text-align:center;text-decoration:none;font-size:22px;font-weight:700;padding:12px;rotate:-.6deg;box-shadow:2px 4px 8px #0005}
.open[aria-disabled=true]{opacity:.65;pointer-events:none}
.nav{display:flex;justify-content:space-between;font-size:19px;border-top:2px dashed #f3f2e655;padding-top:12px}
@media(max-width:600px){.side{text-align:left}.links{justify-content:flex-start}.d-main{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* 3D 교실: 바닥 + 책상 + 캐릭터 */
.roomhint{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#7a6a48;font-size:19px;margin:34px 6px 8px}
.roomwrap{overflow:hidden;overflow:clip visible;padding-top:36px;margin-top:-36px}
.room{position:relative;height:calc(var(--s,1)*720px);perspective:calc(var(--s,1)*1800px);perspective-origin:50% 0}
.fl{position:absolute;left:50%;top:0;width:520px;height:720px;margin-left:-260px;transform-origin:50% 0;transform:scale3d(var(--s,1),var(--s,1),var(--s,1)) rotateX(45deg);transform-style:preserve-3d;
  background:repeating-linear-gradient(90deg,#dccba6 0 64px,#cdbb92 64px 65px);border:6px solid #b39b6c;border-top-width:14px;box-sizing:content-box;margin-left:-266px;cursor:pointer;touch-action:manipulation}
.desk{position:absolute;transform:translateZ(2px);width:64px;height:54px;padding:0;border-radius:4px 4px 10px 10px;
  background:linear-gradient(#c9975b 0 28px,#a87540 28px 33px,transparent 33px 38px,#8fa3b8 38px) center/100% 100% no-repeat,none;clip-path:polygon(0 0,100% 0,100% 33px,76% 33px,76% 100%,24% 100%,24% 33px,0 33px)}
.desk:hover,.desk:focus-visible{filter:brightness(1.15);outline:0}
.me{position:absolute;left:0;top:0;width:200px;display:flex;flex-direction:column;align-items:center;pointer-events:none;transform-origin:50% 100%;will-change:transform}
.me .tag{background:#fff;color:#333;border-radius:99px;padding:0 9px;font-size:21px;line-height:1.25;box-shadow:0 1px 3px #0004;white-space:nowrap}
.me.mine .tag{background:#f6dc7a;font-weight:700;font-size:28px}
.me .av{font-size:44px;line-height:1.1;filter:drop-shadow(0 4px 2px #0003)}
.me.sit .av{font-size:36px}
.me.walk .av{animation:bob .25s infinite alternate}@keyframes bob{to{translate:0 -6px}}
#j-msg{color:#f7a8b8;font-size:19px;min-height:1em}
#joindlg{width:min(440px,92vw)}#joindlg h2{font-size:32px;margin-bottom:14px}
#joindlg label{display:block;font-size:21px;margin:10px 0}
#joindlg input:not([type=radio]){font:inherit;font-size:22px;color:var(--chalk);background:none;border:0;border-bottom:2px solid #f3f2e699;width:100%;padding:4px 2px;outline-offset:4px}
.avs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 18px}.avs label{margin:0!important;position:relative}
.avs input{position:absolute;opacity:0;inset:0}.avs span{display:block;font-size:34px;padding:2px 6px;border-radius:10px;border:2px solid transparent}
.avs input:checked+span{border-color:#f6dc7a;background:#ffffff1a}.avs input:focus-visible+span{outline:2px solid #fff}
.go{display:block;width:100%;background:#fffbe6;color:#333;font-size:22px;font-weight:700;padding:10px;box-shadow:2px 4px 8px #0005}
.qr{background:#fff;padding:14px;width:min(360px,70vw);margin:16px auto;box-shadow:2px 4px 8px #0005}.qr svg{display:block;width:100%;height:auto}
#qrdlg{text-align:center}#qrdlg h2{font-size:32px}#qr-url{font-size:18px;word-break:break-all;opacity:.85;font-family:Arial,sans-serif}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:22px 14px}.card .em{font-size:42px}.card b{font-size:18px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
<div class="board" id="board">
  <canvas id="cv" aria-hidden="true"></canvas>
  <div class="top chalk">
    <div class="logo">✳ MY LAB</div>
    <div>
      <div class="side"><span id="date"></span><br>주번 : 웹앱 <span id="count"></span>개</div>
      <div class="links"><button id="joinbtn">출석하기</button><button id="qrbtn">QR 접속</button><button id="share">공유하기</button><a id="about" target="_blank" rel="noopener">더 알아보기 ↗</a></div>
    </div>
  </div>
  <div class="chalk">
    <h1>오늘의 수업 : <u>웹앱 놀이터</u></h1>
    <p class="sub">만들고, 실험하고, 써 보면서 배우는 시간. 종이를 눌러 열어 보세요.</p>
  </div>
  <div class="grid" id="grid"></div>
  <p class="hint chalk">※ 빈 곳에는 분필로 낙서할 수 있어요 (마우스 드래그)</p>
</div>
<div class="tray" id="tray"><button class="eraser" id="erase">지우개</button></div>

<dialog id="dlg">
  <div class="chalk">
    <div class="d-head"><span id="d-tag"></span><span><span id="d-pos"></span> &nbsp;<button id="close" aria-label="닫기">✕</button></span></div>
    <div class="d-main"><div class="em" id="d-emoji"></div><div><h2 id="d-title"></h2><p id="d-desc"></p><div class="chips" id="d-chips"></div></div></div>
  </div>
  <a class="open" id="d-open" target="_blank" rel="noopener"></a>
  <div class="nav chalk"><button id="prev">← 이전 시간</button><button id="next">다음 시간 →</button></div>
</dialog>

<div class="roomhint"><span>👆 바닥을 누르면 이동, 책상을 누르면 앉아요 (PC는 방향키)</span><span id="online"></span></div>
<div class="roomwrap"><div class="room" id="room"><div class="fl" id="fl"></div></div></div>

<dialog id="joindlg">
  <form id="joinform" class="chalk">
    <h2>✋ 출석 체크</h2>
    <label>번호 <input id="j-no" type="number" min="1" max="99" inputmode="numeric" required></label>
    <label>이름 <input id="j-name" maxlength="10" autocomplete="off" required></label>
    <div style="font-size:21px">캐릭터</div>
    <div class="avs" id="avs"></div>
    <p id="j-msg"></p>
    <button class="go">입장하기</button>
    <div class="nav" style="justify-content:center;margin-top:16px;border:0"><button type="button" id="j-skip">구경만 하기</button></div>
  </form>
</dialog>

<dialog id="qrdlg">
  <div class="chalk"><h2>📱 카메라로 찍고 들어오세요</h2></div>
  <div class="qr" id="qr"></div>
  <p class="chalk" id="qr-url"></p>
  <div class="nav chalk" style="justify-content:center;margin-top:16px"><button id="qr-close">닫기 ✕</button></div>
</dialog>

<script>
// ===== 여기만 고치면 됩니다 =====
const SITE_URL  = "https://denemtia.github.io/class/";                    // 학생 접속 주소 (배포 후 입력, 비우면 현재 주소)
const ABOUT_URL = "https://github.com/";   // "더 알아보기" 링크
const APPS = [                              // url이 비어 있으면 "준비 중"으로 표시
  {title:"자리배치 프로그램", tag:"CLASSROOM", emoji:"🪑", color:"#a9c8f0", url:"", chips:["교실","자리 바꾸기"], desc:"교실 평면에 책상을 놓고 자리를 배치하는 프로그램입니다."},
  {title:"수업", tag:"CLASS", emoji:"📖", color:"#f3d27a", url:"", chips:["수업"], desc:"수업에서 쓰는 자료와 활동이 올라올 자리입니다."},
];
const FIREBASE_DB_URL = "https://class-hub-85cff-default-rtdb.asia-southeast1.firebasedatabase.app";              // 실시간 DB 주소 (비우면 각자 자기 캐릭터만 보임)
const MAX_PLAYERS = 40;                    // 정원
const CHALKS = ["#f3f2e6", "#f6dc7a", "#f7a8b8", "#9fd0f0"];   // 분필 색
// ================================

const $ = id => document.getElementById(id), n = APPS.length, pad = i => String(i + 1).padStart(2, "0");
const dlg = $("dlg");
$("about").href = ABOUT_URL;
$("count").textContent = n;
$("date").textContent = new Date().toLocaleDateString("ko-KR", {month: "long", day: "numeric", weekday: "long"});

APPS.forEach((a, i) => {
  const b = document.createElement("button");
  b.className = "card";
  b.style.setProperty("--c", a.color);
  b.innerHTML = `<span class="no">${pad(i)}</span><span class="em">${a.emoji}</span><b>${a.title}</b><small>${a.tag}</small>`;
  b.onclick = () => show(i);
  $("grid").append(b);
});

// 상세
let cur = 0;
function show(i) {
  cur = (i + n) % n;
  const a = APPS[cur];
  $("d-emoji").textContent = a.emoji;
  $("d-tag").textContent = a.tag; $("d-pos").textContent = `${cur + 1}교시 / ${n}`;
  $("d-title").textContent = a.title; $("d-desc").textContent = a.desc;
  $("d-chips").replaceChildren(...a.chips.map(c => Object.assign(document.createElement("span"), {textContent: c})));
  const o = $("d-open");
  o.textContent = a.url ? "웹앱 열기 ↗" : "준비 중 · 곧 공개됩니다";
  a.url ? o.href = a.url : o.removeAttribute("href");
  o.setAttribute("aria-disabled", !a.url);
  if (!dlg.open) dlg.showModal();
}
$("prev").onclick = () => show(cur - 1);
$("next").onclick = () => show(cur + 1);
$("close").onclick = () => dlg.close();
dlg.onclick = e => e.target === dlg && dlg.close();
dlg.onkeydown = e => e.key === "ArrowLeft" ? show(cur - 1) : e.key === "ArrowRight" && show(cur + 1);

$("share").onclick = e => navigator.clipboard.writeText(location.href)
  .then(() => "링크 복사됨 ✓", () => "복사 실패")
  .then(msg => { e.target.textContent = msg; setTimeout(() => e.target.textContent = "공유하기", 1800); });

// QR 접속 (프로젝터에 띄워 학생들이 스캔)
const qrdlg = $("qrdlg");
$("qrbtn").onclick = () => {
  const url = (SITE_URL || location.href.split("#")[0]) + "#join";   // #join → 접속하면 출석 창이 바로 뜸
  $("qr-url").textContent = url;
  if (window.qrcode) { const q = qrcode(0, "M"); q.addData(url); q.make(); $("qr").innerHTML = q.createSvgTag({cellSize: 8, margin: 2, scalable: true}); }
  else $("qr").textContent = "QR을 불러오지 못했습니다. 아래 주소로 접속하세요.";
  qrdlg.showModal();
};
$("qr-close").onclick = () => qrdlg.close();
qrdlg.onclick = e => e.target === qrdlg && qrdlg.close();

// ===== 3D 교실: 출석 → 캐릭터 → 이동·착석 =====
// 좌표는 모든 기기가 같은 논리 크기(W×H)를 쓰고, 화면에는 CSS로 축소·기울여 보여 줌
const AVATARS = ["🧑‍🎓", "🐱", "🐶", "🐰", "🦊", "🐻", "🐧", "🤖"], SPEED = 200, W = 520, H = 720, TILT = 45, CW = 200;
const SEATS = [];   // 5열 × 8줄 = 40석, 좌표는 의자 위치
for (let r = 0; r < 8; r++) for (let c = 0; c < 5; c++) SEATS.push({x: 60 + c * 100, y: 130 + r * 74});
const room = $("room"), fl = $("fl"), joindlg = $("joindlg"), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fitRoom = () => room.style.setProperty("--s", Math.min(1.1, room.clientWidth / 790, Math.max(.45, (innerHeight - 70) / 720)));
fitRoom(); addEventListener("resize", fitRoom);
SEATS.forEach((p, i) => {
  const d = document.createElement("button");
  d.className = "desk"; d.ariaLabel = `${i + 1}번 자리`;
  d.style.left = p.x - 32 + "px"; d.style.top = p.y - 46 + "px";
  d.onclick = () => sit(i);
  fl.append(d);
});

const players = new Map();   // id → {el, tag, av, x, y, gx, gy, seat}  (gx,gy = 가려는 곳)
let me = null, profile = null, net = null, myId;
try { myId = localStorage.getItem("class-id") || crypto.randomUUID(); localStorage.setItem("class-id", myId); }
catch { myId = Math.random().toString(36).slice(2); }
const keys = new Set(), MOVE = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "a", "d", "w", "s"];
$("avs").innerHTML = AVATARS.map((a, i) => `<label><input type="radio" name="av" value="${a}" ${i ? "" : "checked"}><span>${a}</span></label>`).join("");

// 저장소·네트워크에서 온 값은 믿지 않고 여기서 걸러 냄
const clean = v => !v || typeof v.name !== "string" || !v.name.trim() || !AVATARS.includes(v.avatar) ? null : {
  no: clamp(Math.round(+v.no) || 1, 1, 99), name: v.name.trim().slice(0, 10), avatar: v.avatar,
  x: clamp(+v.x || 0, 0, W), y: clamp(+v.y || 0, 0, H), seat: Number.isInteger(v.seat) && v.seat >= 0 && v.seat < SEATS.length ? v.seat : -1};
const label = (o, p) => { o.tag.textContent = `${p.no}번 ${p.name}`; o.av.textContent = p.avatar; };
const count = () => $("online").textContent = `접속 ${players.size}명 / 정원 ${MAX_PLAYERS}명`;
function makeChar(id, p, x, y) {
  const el = document.createElement("div"), tag = document.createElement("span"), av = document.createElement("span");
  el.className = "me"; tag.className = "tag"; av.className = "av";
  el.append(tag, av); fl.append(el);
  const o = {el, tag, av, x, y, gx: x, gy: y, seat: -1};
  label(o, p); players.set(id, o); count();
  return o;
}
function upsert(id, raw) {   // 다른 학생
  const v = clean(raw); if (!v) return;
  let o = players.get(id);
  if (!o) { if (players.size >= MAX_PLAYERS + 5) return; o = makeChar(id, v, v.x, v.y); } else label(o, v);
  o.gx = v.x; o.gy = v.y; o.seat = v.seat;
}
function drop(id) { players.get(id)?.el.remove(); players.delete(id); count(); }
count();

function enter(p) {
  profile = {no: p.no, name: p.name, avatar: p.avatar};
  if (me) label(me, profile); else { me = makeChar(myId, profile, W / 2, H - 24); me.el.classList.add("mine"); }
  net?.put();
  $("joinbtn").textContent = "이름 바꾸기";
}
$("joinform").onsubmit = e => {
  e.preventDefault();
  const p = clean({no: $("j-no").value, name: $("j-name").value, avatar: e.target.av.value});
  if (!p) return;
  // ponytail: 정원은 화면에서만 확인(동시에 들어오면 1~2명 넘을 수 있음). 엄격히 막으려면 DB 규칙/트랜잭션
  if (!me && players.size >= MAX_PLAYERS) return void ($("j-msg").textContent = `정원(${MAX_PLAYERS}명)이 찼어요. 잠시 뒤 다시 들어와 주세요.`);
  try { localStorage.setItem("class-me", JSON.stringify(profile = {no: p.no, name: p.name, avatar: p.avatar})); } catch {}
  enter(p); joindlg.close();
  room.scrollIntoView({block: "center"});
};
$("joinbtn").onclick = () => joindlg.showModal();
$("j-skip").onclick = () => joindlg.close();
let saved = null;
try { saved = clean(JSON.parse(localStorage.getItem("class-me"))); } catch {}
if (saved) enter(saved); else if (location.hash === "#join") joindlg.showModal();

function go(x, y, seat = -1) {
  if (!me) return joindlg.showModal();
  me.gx = clamp(x, 12, W - 12); me.gy = clamp(y, 30, H - 4); me.seat = seat;
}
// ponytail: 같은 자리를 동시에 누르면 둘 다 앉을 수 있음. 막으려면 자리별 DB 트랜잭션
function sit(i) { for (const o of players.values()) if (o !== me && o.seat === i) return; go(SEATS[i].x, SEATS[i].y, i); }
fl.onclick = e => e.target === fl && go(e.offsetX, e.offsetY);
addEventListener("keydown", e => { if (me && MOVE.includes(e.key) && !document.querySelector("dialog[open]")) { keys.add(e.key); e.preventDefault(); } });
addEventListener("keyup", e => keys.delete(e.key));
addEventListener("blur", () => keys.clear());

let lastT = performance.now();
requestAnimationFrame(function tick(t) {
  const dt = Math.min(t - lastT, 250) / 1000; lastT = t;   // 느린 기기에서도 걷는 속도는 같게
  const k = (...a) => a.some(x => keys.has(x));
  for (const o of players.values()) {
    let dx = 0, dy = 0;
    if (o === me && keys.size) {
      dx = k("ArrowRight", "d") - k("ArrowLeft", "a"); dy = k("ArrowDown", "s") - k("ArrowUp", "w");
      const len = Math.hypot(dx, dy) || 1;
      go(o.x + dx / len * SPEED * dt, o.y + dy / len * SPEED * dt); o.x = o.gx; o.y = o.gy;
    } else {
      dx = o.gx - o.x; dy = o.gy - o.y;
      const d = Math.hypot(dx, dy), step = SPEED * dt;
      if (d <= step) { o.x = o.gx; o.y = o.gy; dx = dy = 0; } else { o.x += dx / d * step; o.y += dy / d * step; }
    }
    o.h ||= o.el.offsetHeight;
    o.el.style.transform = `translate3d(${o.x - CW / 2}px,${o.y - o.h}px,4px) rotateX(-${TILT}deg)`;
    o.el.classList.toggle("walk", !!(dx || dy));
    o.el.classList.toggle("sit", !dx && !dy && o.seat >= 0);
  }
  requestAnimationFrame(tick);
});

// 실시간 동기화 (Firebase Realtime Database). 창을 닫으면 내 기록은 자동 삭제됨
// ponytail: 로그인 없이 쓰기 허용(규칙으로 형식·길이만 검증). 장난 방지가 필요하면 익명 인증 + uid 규칙
if (FIREBASE_DB_URL) (async () => {
  try {
    const V = "https://www.gstatic.com/firebasejs/10.12.2/";
    const [{initializeApp}, db] = await Promise.all([import(V + "firebase-app.js"), import(V + "firebase-database.js")]);
    const d = db.getDatabase(initializeApp({databaseURL: FIREBASE_DB_URL}));
    const all = db.ref(d, "rooms/main/players"), mine = db.child(all, myId);
    const state = () => ({x: Math.round(me.gx), y: Math.round(me.gy), seat: me.seat});
    let sent = "";
    db.onChildAdded(all, s => s.key !== myId && upsert(s.key, s.val()));
    db.onChildChanged(all, s => s.key !== myId && upsert(s.key, s.val()));
    db.onChildRemoved(all, s => s.key !== myId && drop(s.key));
    net = {put() { if (me) { db.onDisconnect(mine).remove(); db.set(mine, {...profile, ...state()}); } }};
    db.onValue(db.ref(d, ".info/connected"), s => s.val() && net.put());
    // 목적지가 바뀔 때만, 최대 초당 5번 전송 → 40명이어도 무료 한도 안에서 여유
    setInterval(() => { if (!me) return; const v = state(), key = JSON.stringify(v); if (key !== sent) { sent = key; db.update(mine, v); } }, 200);
  } catch (e) { console.warn("실시간 연결 실패 — 혼자 모드로 동작합니다", e); }
})();

// 분필 낙서
const cv = $("cv"), ctx = cv.getContext("2d");
// ponytail: 창 크기를 바꾸면 낙서가 지워짐. 유지하려면 획을 배열에 저장해 다시 그리기
const fit = () => { cv.width = cv.clientWidth; cv.height = cv.clientHeight; };
fit(); addEventListener("resize", fit);
CHALKS.forEach((k, i) => {
  const s = document.createElement("button");
  s.className = "stick"; s.style.setProperty("--k", k); s.ariaLabel = "분필 색 " + (i + 1); s.ariaPressed = i === 0;
  s.onclick = () => { pen = k; document.querySelectorAll(".stick").forEach(x => x.ariaPressed = x === s); };
  $("erase").before(s);
});
let pen = CHALKS[0], drawing = false;
cv.onpointerdown = e => {
  if (e.pointerType === "touch") return;   // 터치는 스크롤 우선 (낙서는 마우스·펜만)
  drawing = true; cv.setPointerCapture(e.pointerId);
  ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY);
  ctx.strokeStyle = pen; ctx.lineWidth = 4; ctx.lineCap = ctx.lineJoin = "round"; ctx.globalAlpha = .85;
};
cv.onpointermove = e => { if (drawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } };
cv.onpointerup = cv.onpointercancel = () => drawing = false;
$("erase").onclick = () => ctx.clearRect(0, 0, cv.width, cv.height);
</script>
</body>
