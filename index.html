<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 허용한 곳 외의 스크립트·통신을 브라우저가 막도록 함 (Firebase 연결용 주소만 허용) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://*.firebasedatabase.app https://*.firebaseio.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://*.firebasedatabase.app https://*.firebaseio.com wss://*.firebasedatabase.app wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://*.firebasedatabase.app https://*.firebaseio.com; base-uri 'none'; form-action 'none'">
<title>MY LAB — 웹앱 놀이터</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--board:#2f5d48;--chalk:#f3f2e6;--wood:#a9744a;--pen:#f3f2e6}
*{box-sizing:border-box;margin:0}
body{background:#efe6d3;min-height:100vh;padding:clamp(10px,3vw,36px);font-family:Gaegu,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--chalk);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
/* 칠판 */
.board{flex:1;position:relative;border:16px solid var(--wood);border-image:linear-gradient(#b98356,#8d5c36) 1;box-shadow:0 14px 30px #5a40222e,inset 0 0 60px #0004;
  background:radial-gradient(40% 30% at 20% 30%,#ffffff10,transparent),radial-gradient(50% 40% at 75% 65%,#ffffff0c,transparent),var(--board);
  padding:clamp(16px,3vw,36px);display:flex;flex-direction:column;gap:22px}
.chalk{text-shadow:0 0 1px #fff8,1px 1px 0 #fff2;opacity:.93}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;pointer-events:none}
.top a,.top button{pointer-events:auto}
.logo{font-size:22px;font-weight:700;letter-spacing:.06em}
.side{border:2px solid #f3f2e699;border-radius:4px 7px 5px 8px;padding:8px 14px;font-size:18px;line-height:1.5;text-align:right}
.links{display:flex;flex-wrap:wrap;gap:16px;font-size:18px;margin-top:6px;justify-content:flex-end}
.links *{text-decoration:underline wavy #f3f2e677;text-underline-offset:4px}
h1{font-size:clamp(34px,6vw,64px);line-height:1.1;pointer-events:none}
h1 u{text-decoration:underline wavy #f6dc7a;text-underline-offset:8px;color:#f6dc7a}
.sub{font-size:20px;opacity:.8;pointer-events:none;margin-top:8px}
/* 자석으로 붙인 종이 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 22px;margin-top:8px}
.card{background:#fff;background:linear-gradient(#fff,color-mix(in srgb,var(--c) 22%,#fff));color:#333;padding:22px 12px 12px;border-radius:2px;box-shadow:2px 4px 8px #0005;
  display:flex;flex-direction:column;gap:4px;text-align:center;position:relative;transition:.2s;rotate:1.5deg}
.card:nth-child(3n){rotate:-2deg}.card:nth-child(4n+2){rotate:-.8deg}.card:nth-child(5n){rotate:2.4deg}
.card::before{content:"";position:absolute;top:-9px;left:50%;translate:-50%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,transparent 40%),var(--c);box-shadow:0 2px 3px #0006;filter:saturate(1.6) brightness(.9)}
.card:hover,.card:focus-visible{rotate:0deg;translate:0 -6px;box-shadow:4px 12px 18px #0007;outline:0}
.card .no{position:absolute;left:8px;top:6px;font-size:14px;color:#999}
.card .em{font-size:52px;line-height:1.3}
.card b{font-size:20px}.card small{font-size:13px;letter-spacing:.1em;color:#888;font-family:Arial,sans-serif}
/* 분필 받침 */
.tray{height:26px;background:linear-gradient(#c08a5c,#8d5c36);margin:0 -6px;border-radius:0 0 4px 4px;box-shadow:0 6px 10px #0003;display:flex;align-items:flex-end;gap:10px;padding:0 5%}
/* 상세: 작은 칠판 */
dialog{margin:auto;width:min(620px,92vw);border:12px solid var(--wood);border-image:linear-gradient(#b98356,#8d5c36) 1;background:var(--board);color:var(--chalk);padding:28px;box-shadow:0 30px 80px #0008;font-family:inherit}
dialog::backdrop{background:#2a1e1288;backdrop-filter:blur(4px)}
.d-head{display:flex;justify-content:space-between;font-size:17px;opacity:.7}
.d-main{display:flex;gap:20px;align-items:center;margin:14px 0}
.d-main .em{font-size:84px;border:2px dashed #f3f2e688;border-radius:10px;padding:6px 16px}
dialog h2{font-size:38px;color:#f6dc7a}
dialog p{font-size:21px;line-height:1.5;margin:8px 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{border:1.5px solid #f3f2e699;border-radius:99px;padding:2px 12px;font-size:16px}
.open{display:block;margin:22px 0 16px;background:#fffbe6;color:#333;text-align:center;text-decoration:none;font-size:22px;font-weight:700;padding:12px;rotate:-.6deg;box-shadow:2px 4px 8px #0005}
.open[aria-disabled=true]{opacity:.65;pointer-events:none}
.nav{display:flex;justify-content:space-between;font-size:19px;border-top:2px dashed #f3f2e655;padding-top:12px}
@media(max-width:600px){.side{text-align:left}.links{justify-content:flex-start}.d-main{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* 3D 교실: 바닥 + 책상 + 캐릭터 */
.roomhint{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#7a6a48;font-size:19px;margin:34px 6px 8px}
.roomwrap{overflow:hidden;overflow:clip visible;padding-top:36px;margin-top:-36px}
.room{position:relative;height:calc(var(--s,1)*720px);perspective:calc(var(--s,1)*1800px);perspective-origin:50% 0}
.fl{position:absolute;left:50%;top:0;width:520px;height:720px;margin-left:-260px;transform-origin:50% 0;transform:scale3d(var(--s,1),var(--s,1),var(--s,1)) rotateX(45deg);transform-style:preserve-3d;
  background:repeating-linear-gradient(90deg,#dccba6 0 64px,#cdbb92 64px 65px);border:6px solid #b39b6c;border-top-width:14px;box-sizing:content-box;margin-left:-266px;cursor:pointer;touch-action:manipulation}
.desk{position:absolute;transform:translateZ(2px);width:64px;height:54px;padding:0;border-radius:4px 4px 10px 10px;
  background:linear-gradient(#c9975b 0 28px,#a87540 28px 33px,transparent 33px 38px,#8fa3b8 38px) center/100% 100% no-repeat,none;clip-path:polygon(0 0,100% 0,100% 33px,76% 33px,76% 100%,24% 100%,24% 33px,0 33px)}
.desk{color:#fff;font:700 16px/28px Arial,sans-serif;padding:0 0 26px;text-align:center}
.desk.mydesk{background-image:linear-gradient(#f6dc7a 0 28px,#d9b84a 28px 33px,transparent 33px 38px,#8fa3b8 38px);color:#333}
.desk:hover,.desk:focus-visible{filter:brightness(1.15);outline:0}
.me{position:absolute;left:0;top:0;width:200px;display:flex;flex-direction:column;align-items:center;pointer-events:none;transform-origin:50% 100%;will-change:transform}
.me .tag{background:#fff;color:#333;border-radius:99px;padding:0 9px;font-size:21px;line-height:1.25;box-shadow:0 1px 3px #0004;white-space:nowrap}
.me.mine .tag{background:#f6dc7a;font-weight:700;font-size:28px}
.me .av{font-size:44px;line-height:1.1;filter:drop-shadow(0 4px 2px #0003)}
.me.sit .av{font-size:36px}
.me.walk .av{animation:bob .25s infinite alternate}@keyframes bob{to{translate:0 -6px}}
#j-msg{color:#f7a8b8;font-size:19px;min-height:1em}
#joindlg{width:min(440px,92vw)}#joindlg h2{font-size:32px;margin-bottom:14px}
#joindlg label{display:block;font-size:21px;margin:10px 0}
#joindlg input:not([type=radio]){font:inherit;font-size:22px;color:var(--chalk);background:none;border:0;border-bottom:2px solid #f3f2e699;width:100%;padding:4px 2px;outline-offset:4px}
.avs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 18px}.avs label{margin:0!important;position:relative}
.avs input{position:absolute;opacity:0;inset:0}.avs span{display:block;font-size:34px;padding:2px 6px;border-radius:10px;border:2px solid transparent}
.avs input:checked+span{border-color:#f6dc7a;background:#ffffff1a}.avs input:focus-visible+span{outline:2px solid #fff}
.go{display:block;width:100%;background:#fffbe6;color:#333;font-size:22px;font-weight:700;padding:10px;box-shadow:2px 4px 8px #0005}
/* 수업 중에는 칠판만 (선생님이 켬) */
body.lesson:not(.quiz) .roomhint,body.lesson:not(.quiz) .roomwrap{display:none}
/* OX 퀴즈: 책상을 치우고 바닥을 O(왼쪽)·X(오른쪽)로 나눔 */
.quizbar{background:#fffbe6;color:#333;border-radius:12px;padding:12px 18px;margin:26px 6px 0;text-align:center;box-shadow:2px 4px 8px #0003;font-size:clamp(22px,3.4vw,36px);line-height:1.3}
.quizbar span{display:block;font-size:.72em;color:#b0452f;font-weight:700}
.quizbar[hidden]{display:none}
.zone{position:absolute;top:0;width:50%;height:calc(100% - 84px);display:none;place-items:center;font:900 190px Arial,sans-serif;color:#fffc;pointer-events:none;transform:translateZ(1px)}
.zone.o{left:0;background:#3fa56b66}.zone.x{right:0;background:#d9534f66}
.zone.c{top:auto;bottom:0;left:0;width:100%;height:84px;background:#8d5c3655;font:700 30px Gaegu,sans-serif}
body.quiz .zone{display:grid}body.quiz .desk{display:none}
.wall{flex:1;display:flex;gap:26px;align-items:flex-start}
.boardcol{flex:1;min-width:0;display:flex;flex-direction:column;align-self:stretch}
.sidecol{width:210px;margin-top:34px;position:sticky;top:16px;display:flex;flex-direction:column;gap:26px}
.sidecol[hidden]{display:none}
.qrside{position:relative;background:#fffbe6;color:#333;padding:20px 14px 12px;box-shadow:2px 4px 8px #0005;rotate:1.5deg;text-align:center;font-size:20px;display:flex;flex-direction:column;gap:8px}
.qrside::before{content:"";position:absolute;top:-9px;left:50%;translate:-50%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,transparent 40%),#e0688f;box-shadow:0 2px 3px #0006}
.qrside svg{display:block;width:100%;height:auto}.qrside small{font-size:17px;color:#777}
.tools{background:#fffbe6;color:#333;padding:14px 12px;box-shadow:2px 4px 8px #0005;rotate:-1deg;display:flex;flex-direction:column;gap:7px;font-size:19px;text-align:center}
.tools input{font:inherit;border:1.5px solid #bbb;border-radius:8px;padding:4px 8px;min-width:0;background:#fff}
.tools button{font:inherit;border:1.5px solid #8d5c36;border-radius:8px;padding:4px 6px;background:#fff}
.tools button:hover:not(:disabled){background:#f6dc7a}.tools button:disabled{opacity:.4;cursor:default}
.tools .two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tools small{font-size:16px;color:#b0452f;min-height:1.2em}
/* 좁은 화면(선생님 태블릿): 칠판 아래로 내려서 가로로 */
@media(max-width:900px){.wall{flex-direction:column}.sidecol{width:auto;margin-top:0;position:static;flex-direction:row;align-items:flex-start;align-self:center}.qrside{width:170px}.tools{width:230px}}
.qr{background:#fff;padding:14px;width:min(360px,70vw);margin:16px auto;box-shadow:2px 4px 8px #0005}.qr svg{display:block;width:100%;height:auto}
#qrdlg{text-align:center}#qrdlg h2{font-size:32px}#qr-url{font-size:18px;word-break:break-all;opacity:.85;font-family:Arial,sans-serif}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:22px 14px}.card .em{font-size:42px}.card b{font-size:18px}}
</style>
<script src="qrcode.js"></script>
<script src="common.js"></script>
</head>
<body>
<div class="wall"><div class="boardcol">
<div class="board" id="board">
  <div class="top chalk">
    <div class="logo">✳ <span id="school">MY LAB</span></div>
    <div>
      <div class="side"><span id="date"></span><br><span id="cls">웹앱 놀이터</span></div>
      <div class="links"><button id="joinbtn">출석하기</button><button id="qrbtn">QR 접속</button><button id="share">공유하기</button><a href="teacher.html">선생님 →</a></div>
    </div>
  </div>
  <div class="chalk">
    <h1>오늘의 수업 : <u id="title">웹앱 놀이터</u></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="tray"></div>
</div>
<!-- 칠판 옆에 늘 붙어 있는 QR (교실 주소로 들어왔을 때만, 큰 화면에서만) -->
<aside class="sidecol" id="sidecol" hidden>
  <button class="qrside" id="qrside" aria-label="QR 크게 보기"><b>📱 QR로 들어오기</b><span id="qrsmall"></span><small id="qrcls"></small></button>
  <!-- 수업 도구: 이 반 선생님 화면에만 보임 -->
  <div class="tools" id="tools">
    <b>🧰 수업 도구</b>
    <input id="q-text" maxlength="80" placeholder="OX 문제를 적어 주세요" aria-label="OX 문제">
    <button id="q-ask">⭕❌ 문제 내기</button>
    <div class="two"><button id="q-o" disabled>정답 O</button><button id="q-x" disabled>정답 X</button></div>
    <button id="q-draw">🏆 1등 추첨 (남은 사람 중)</button>
    <button id="q-pick">🎲 아무나 뽑기</button>
    <button id="q-end">끝내기</button>
    <small id="q-info" role="status"></small>
  </div>
</aside>
</div>

<dialog id="dlg">
  <div class="chalk">
    <div class="d-head"><span id="d-tag"></span><span><span id="d-pos"></span> &nbsp;<button id="close" aria-label="닫기">✕</button></span></div>
    <div class="d-main"><div class="em" id="d-emoji"></div><div><h2 id="d-title"></h2><p id="d-desc"></p><div class="chips" id="d-chips"></div></div></div>
  </div>
  <a class="open" id="d-open" target="_blank" rel="noopener"></a>
  <div class="nav chalk"><button id="prev">← 이전 시간</button><button id="next">다음 시간 →</button></div>
</dialog>

<div class="quizbar" id="quizbar" hidden role="status"><b id="qb-q"></b><span id="qb-r"></span></div>
<div class="roomhint"><span id="hint">👆 바닥을 누르면 이동, 책상을 누르면 앉아요 (PC는 방향키)</span><span id="online"></span></div>
<div class="roomwrap"><div class="room" id="room"><div class="fl" id="fl"></div></div></div>

<dialog id="joindlg">
  <form id="joinform" class="chalk">
    <h2>✋ 출석 체크</h2>
    <label>번호 <input id="j-no" type="number" min="1" max="99" inputmode="numeric" required></label>
    <label>이름 <input id="j-name" maxlength="10" autocomplete="off" required></label>
    <div style="font-size:21px">캐릭터</div>
    <div class="avs" id="avs"></div>
    <p id="j-msg"></p>
    <button class="go">입장하기</button>
    <div class="nav" style="justify-content:center;margin-top:16px;border:0"><button type="button" id="j-skip">구경만 하기</button></div>
  </form>
</dialog>

<dialog id="qrdlg">
  <div class="chalk"><h2>📱 카메라로 찍고 들어오세요</h2></div>
  <div class="qr" id="qr"></div>
  <div class="nav chalk" style="justify-content:center;margin-top:16px"><button id="qr-close">닫기 ✕</button></div>
</dialog>

<script>
const MAX_PLAYERS = 40;                    // 반 정원
const PAPERS = ["#f3d27a", "#a9c8f0", "#f5a9c0", "#9ad7b0", "#c9b6f2", "#f6b98a"];   // 메뉴 종이 색

const $ = id => document.getElementById(id), pad = i => String(i + 1).padStart(2, "0");
const dlg = $("dlg");
$("date").textContent = new Date().toLocaleDateString("ko-KR", {month: "long", day: "numeric", weekday: "long"});

// 선생님 설정 적용: 학교·반·제목·문구·칠판 색·캐릭터·메뉴. 선생님이 쓴 글은 전부 textContent로만 넣음
let APPS = [], avatars = AVATARS_ALL.slice(0, 8);
function applySettings(pub, cls) {
  const p = cleanPub(pub);
  $("school").textContent = p.school || "MY LAB";
  $("cls").textContent = [str(cls, 20), p.name && p.name + " 선생님"].filter(Boolean).join(" · ") || "웹앱 놀이터";
  $("title").textContent = p.title || "웹앱 놀이터";
  $("qrcls").textContent = str(cls, 20);
  $("sub").textContent = p.sub || (ROOM ? "만들고, 실험하고, 써 보면서 배우는 시간." : "선생님께 받은 QR이나 주소로 들어오면 우리 반 교실이 열려요.");
  document.documentElement.style.setProperty("--board", THEMES[p.theme]);
  avatars = p.avatars; APPS = p.apps;
  $("avs").replaceChildren(...avatars.map((a, i) => {
    const l = document.createElement("label"), r = document.createElement("input"), sp = document.createElement("span");
    r.type = "radio"; r.name = "av"; r.value = a; r.checked = profile ? profile.avatar === a : !i; sp.textContent = a;
    l.append(r, sp); return l;
  }));
  if (!$("avs").querySelector(":checked")) $("avs").querySelector("input").checked = true;
  $("grid").replaceChildren(...APPS.map((a, i) => {
    const b = document.createElement("button"), mk = (tag, cls, t) => Object.assign(document.createElement(tag), {className: cls, textContent: t});
    b.className = "card"; b.style.setProperty("--c", PAPERS[i % PAPERS.length]);
    b.append(mk("span", "no", pad(i)), mk("span", "em", a.emoji), mk("b", "", a.title));
    b.onclick = () => show(i);
    return b;
  }));
}

// 상세
let cur = 0;
function show(i) {
  const n = APPS.length; if (!n) return;
  cur = (i + n) % n;
  const a = APPS[cur];
  $("d-emoji").textContent = a.emoji;
  $("d-tag").textContent = ""; $("d-pos").textContent = `${cur + 1}교시 / ${n}`;
  $("d-title").textContent = a.title; $("d-desc").textContent = a.desc;
  const o = $("d-open");
  o.textContent = a.url ? "웹앱 열기 ↗" : "준비 중 · 곧 공개됩니다";
  a.url ? o.href = a.url : o.removeAttribute("href");
  o.setAttribute("aria-disabled", !a.url);
  if (!dlg.open) dlg.showModal();
}
$("prev").onclick = () => show(cur - 1);
$("next").onclick = () => show(cur + 1);
$("close").onclick = () => dlg.close();
dlg.onclick = e => e.target === dlg && dlg.close();
dlg.onkeydown = e => e.key === "ArrowLeft" ? show(cur - 1) : e.key === "ArrowRight" && show(cur + 1);

$("share").onclick = e => navigator.clipboard.writeText(location.href)
  .then(() => "링크 복사됨 ✓", () => "복사 실패")
  .then(msg => { e.target.textContent = msg; setTimeout(() => e.target.textContent = "공유하기", 1800); });

// QR 접속 (프로젝터에 띄워 학생들이 스캔)
const qrdlg = $("qrdlg");
const qrSvg = () => {   // 교실 주소(#join → 접속하면 출석 창이 바로 뜸)의 QR. 주소 글자는 화면에 보이지 않게 함
  const q = qrcode(0, "M"); q.addData((ROOM ? roomUrl(ROOM) : SITE_URL) + "#join"); q.make();
  return q.createSvgTag({cellSize: 8, margin: 2, scalable: true});   // 주소는 고정 주소 + 영숫자 코드뿐
};
$("qrbtn").onclick = $("qrside").onclick = () => { $("qr").innerHTML = qrSvg(); qrdlg.showModal(); };
if (ROOM) $("qrsmall").innerHTML = qrSvg();
$("qr-close").onclick = () => qrdlg.close();
qrdlg.onclick = e => e.target === qrdlg && qrdlg.close();

// ===== 3D 교실: 출석 → 캐릭터 → 이동·착석 =====
// 좌표는 모든 기기가 같은 논리 크기(W×H)를 쓰고, 화면에는 CSS로 축소·기울여 보여 줌
const AVATARS = AVATARS_ALL, SPEED = 200, W = 520, H = 720, TILT = 45, CW = 200;
let SEATS = [];                    // 의자 위치(논리 좌표). layout()이 채움
let plan = {G: 0, seats: []};      // 선생님이 자리배치 페이지에서 보낸 배치: 분단 수 G, seats[자리] = 출석번호(0 = 빈자리)
const room = $("room"), fl = $("fl"), joindlg = $("joindlg"), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fitRoom = () => room.clientWidth && room.style.setProperty("--s", Math.min(1.1, room.clientWidth / 790, Math.max(.45, (innerHeight - 70) / 720)));
fitRoom(); addEventListener("resize", fitRoom);

const players = new Map();   // id → {el, tag, av, x, y, gx, gy, seat}  (gx,gy = 가려는 곳)
let me = null, profile = null, net = null, myId;
try { myId = localStorage.getItem("class-id") || crypto.randomUUID(); localStorage.setItem("class-id", myId); }
catch { myId = Math.random().toString(36).slice(2); }
const keys = new Set(), MOVE = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "a", "d", "w", "s"];

// 저장소·네트워크에서 온 값은 믿지 않고 여기서 걸러 냄
const clean = v => !v || typeof v.name !== "string" || !v.name.trim() || !AVATARS.includes(v.avatar) ? null : {
  no: clamp(Math.round(+v.no) || 1, 1, 99), name: v.name.trim().slice(0, 10), avatar: v.avatar,
  x: clamp(+v.x || 0, 0, W), y: clamp(+v.y || 0, 0, H), seat: Number.isInteger(v.seat) && v.seat >= 0 && v.seat < SEATS.length ? v.seat : -1};
const label = (o, p) => { o.tag.textContent = `${p.no}번 ${p.name}`; o.av.textContent = p.avatar; };
const count = () => $("online").textContent.startsWith("🚪") || ($("online").textContent = `접속 ${players.size}명 / 정원 ${MAX_PLAYERS}명`);
function makeChar(id, p, x, y) {
  const el = document.createElement("div"), tag = document.createElement("span"), av = document.createElement("span");
  el.className = "me"; tag.className = "tag"; av.className = "av";
  el.append(tag, av); fl.append(el);
  const o = {el, tag, av, x, y, gx: x, gy: y, seat: -1};
  label(o, p); players.set(id, o); count();
  return o;
}
function upsert(id, raw) {   // 다른 학생
  const v = clean(raw); if (!v) return;
  let o = players.get(id);
  if (!o) { if (players.size >= MAX_PLAYERS + 5) return; o = makeChar(id, v, v.x, v.y); } else label(o, v);
  o.gx = v.x; o.gy = v.y; o.seat = v.seat;
}
function drop(id) { players.get(id)?.el.remove(); players.delete(id); count(); }
count();

// 책상 놓기: 배치가 있으면 6인 분단(자리 순서 1 4 / 2 5 / 3 6)을 한 줄에 3분단씩, 없으면 자유석 5열 × 8줄
const mySeat = () => plan.G && profile ? plan.seats.indexOf(profile.no) : -1;
function layout() {
  SEATS = [];
  if (plan.G) for (let i = 0; i < plan.G * 6; i++) { const g = i / 6 | 0, k = i % 6; SEATS.push({x: 61 + g % 3 * 165 + (k / 3 | 0) * 70, y: 112 + (g / 3 | 0) * 216 + k % 3 * 68}); }
  else for (let r = 0; r < 8; r++) for (let c = 0; c < 5; c++) SEATS.push({x: 60 + c * 100, y: 130 + r * 74});
  fl.querySelectorAll(".desk").forEach(d => d.remove());
  SEATS.forEach((p, i) => {
    const d = document.createElement("button"), no = plan.G && plan.seats[i] || 0;
    d.className = "desk" + (i === mySeat() ? " mydesk" : ""); d.ariaLabel = `${i + 1}번 자리`;
    d.textContent = no || "";
    d.style.left = p.x - 32 + "px"; d.style.top = p.y - 46 + "px";
    d.onclick = () => sit(i);
    fl.append(d);
  });
  for (const o of players.values()) if (o.seat >= SEATS.length) o.seat = -1;
  const moved = layout.G !== plan.G; layout.G = plan.G;   // 책상 위치가 바뀌면 앉아 있던 자리 번호는 무효
  if (me && (plan.G || moved)) { me.seat = -1; const m = mySeat(); if (m >= 0) go(SEATS[m].x, SEATS[m].y, m); }
  $("hint").textContent = mySeat() >= 0 ? "👆 내 자리는 노란 책상이에요" : HINT;
}
const HINT = $("hint").textContent;
layout();

function enter(p) {
  profile = {no: p.no, name: p.name, avatar: p.avatar};
  if (me) label(me, profile); else { me = makeChar(myId, profile, W / 2, H - 24); me.el.classList.add("mine"); }
  layout();   // 내 자리 표시·자동 착석
  net?.put();
  $("joinbtn").textContent = "이름 바꾸기";
}
$("joinform").onsubmit = e => {
  e.preventDefault();
  const p = clean({no: $("j-no").value, name: $("j-name").value, avatar: e.target.av.value});
  if (!p) return;
  // ponytail: 정원은 화면에서만 확인(동시에 들어오면 1~2명 넘을 수 있음). 엄격히 막으려면 DB 규칙/트랜잭션
  if (!me && players.size >= MAX_PLAYERS) return void ($("j-msg").textContent = `정원(${MAX_PLAYERS}명)이 찼어요. 잠시 뒤 다시 들어와 주세요.`);
  try { localStorage.setItem("class-me", JSON.stringify(profile = {no: p.no, name: p.name, avatar: p.avatar})); } catch {}
  enter(p); joindlg.close();
  room.scrollIntoView({block: "center"});
};
$("joinbtn").onclick = () => joindlg.showModal();
$("j-skip").onclick = () => joindlg.close();
applySettings(null, "");
let saved = null;
try { saved = clean(JSON.parse(localStorage.getItem("class-me"))); } catch {}
if (saved) enter(saved); else if (location.hash === "#join") joindlg.showModal();

function go(x, y, seat = -1) {
  if (!me) return joindlg.showModal();
  me.gx = clamp(x, 12, W - 12); me.gy = clamp(y, amOut ? H - CHEER + 34 : 30, H - 4); me.seat = seat;
}
// ponytail: 같은 자리를 동시에 누르면 둘 다 앉을 수 있음. 막으려면 자리별 DB 트랜잭션
function sit(i) {
  for (const o of players.values()) if (o !== me && o.seat === i) return;
  if (me && plan.G && plan.seats[i] && plan.seats[i] !== profile.no) return flash("다른 친구 자리예요");
  go(SEATS[i].x, SEATS[i].y, i);
}
function flash(t) { const h = $("hint"), old = h.textContent; h.textContent = t; setTimeout(() => h.textContent === t && (h.textContent = old), 1500); }
fl.onclick = e => e.target === fl && go(e.offsetX, e.offsetY);
addEventListener("keydown", e => { if (me && MOVE.includes(e.key) && !document.querySelector("dialog[open]") && !document.body.classList.contains("lesson")) { keys.add(e.key); e.preventDefault(); } });
addEventListener("keyup", e => keys.delete(e.key));
addEventListener("blur", () => keys.clear());

let lastT = performance.now();
requestAnimationFrame(function tick(t) {
  const dt = Math.min(t - lastT, 250) / 1000; lastT = t;   // 느린 기기에서도 걷는 속도는 같게
  const k = (...a) => a.some(x => keys.has(x));
  for (const o of players.values()) {
    let dx = 0, dy = 0;
    if (o === me && keys.size) {
      dx = k("ArrowRight", "d") - k("ArrowLeft", "a"); dy = k("ArrowDown", "s") - k("ArrowUp", "w");
      const len = Math.hypot(dx, dy) || 1;
      go(o.x + dx / len * SPEED * dt, o.y + dy / len * SPEED * dt); o.x = o.gx; o.y = o.gy;
    } else {
      dx = o.gx - o.x; dy = o.gy - o.y;
      const d = Math.hypot(dx, dy), step = SPEED * dt;
      if (d <= step) { o.x = o.gx; o.y = o.gy; dx = dy = 0; } else { o.x += dx / d * step; o.y += dy / d * step; }
    }
    o.h ||= o.el.offsetHeight;
    o.el.style.transform = `translate3d(${o.x - CW / 2}px,${o.y - o.h}px,4px) rotateX(-${TILT}deg)`;
    o.el.classList.toggle("walk", !!(dx || dy));
    o.el.classList.toggle("sit", !dx && !dy && o.seat >= 0);
  }
  requestAnimationFrame(tick);
});

// ===== 수업 도구: OX 퀴즈(서바이벌) · 추첨 =====
// 문제가 나오면 바닥이 O(왼쪽)/X(오른쪽)로 나뉘고, 캐릭터를 옮겨서 답함. 틀리면 아래 응원석으로, 끝까지 남으면 우승
const CHEER = 84;   // 응원석 높이(바닥 아래쪽)
for (const [c, t] of [["o", "O"], ["x", "X"], ["c", "📣 응원석"]]) fl.append(Object.assign(document.createElement("div"), {className: "zone " + c, textContent: t}));
const sideOf = o => o.gx < W / 2 ? "O" : "X";
let quizKey = "", amOut = false;
function applyQuiz(v) {
  v = v || {};
  const state = v.state === "ask" || v.state === "reveal" ? v.state : "", winner = str(v.winner, 40), n = Math.round(+v.n) || 0;
  const wasOut = amOut;
  amOut = !!state && !!(v.out && v.out[myId] === true);
  document.body.classList.toggle("quiz", !!state);
  $("quizbar").hidden = !state && !winner;
  $("qb-q").textContent = state ? `Q${n}. ${str(v.q, 80)}` : winner ? "🏆 " + winner : "";
  const key = n + state + winner;
  if (key !== quizKey) {   // 상태가 바뀐 순간에만 문구를 정함
    quizKey = key;
    if (state && me) me.seat = -1;
    if (amOut && me) go(me.gx, H);   // 탈락하면 응원석으로
    const ans = v.ans === "X" ? "X" : "O", left = Math.round(+v.left) || 0;
    $("qb-r").textContent =
      state === "ask" ? (amOut ? "📣 응원석에서 친구들을 응원해요" : "왼쪽은 O, 오른쪽은 X! 캐릭터를 옮기세요")
      : state === "reveal" ? `정답은 ${ans}! ` + (!me ? "" : wasOut ? "📣 응원 중" : amOut ? "😢 탈락! 응원석으로 가요" : "🎉 살아남았어요") + ` · 남은 사람 ${left}명`
      : winner ? "축하해요!" : "";
  }
  fitRoom();
}
// 선생님 화면: 문제 내기 → 정답을 누르는 순간 서 있는 쪽으로 판정 → 틀린 학생은 탈락. 1명이 남으면 우승, 여럿이면 추첨 가능
// ponytail: 탈락 명단은 이 화면 메모리 + quiz/out 에만 있음. 진행 중 선생님 화면을 새로고침하면 새 퀴즈로 시작
function teacherTools(db, R) {
  const out = new Set(), info = t => $("q-info").textContent = t;
  const students = () => [...players].filter(([id]) => id !== myId), alive = () => students().filter(([id]) => !out.has(id));
  let n = 0, q = "", asking = false;
  const outMap = () => Object.fromEntries([...out].map(id => [id, true]));
  const put = v => db.set(R("quiz"), v).catch(() => info("보내지 못했어요. 다시 눌러 주세요."));
  const setAsking = a => { asking = a; $("q-o").disabled = $("q-x").disabled = !a; };
  const win = (o, note) => { setAsking(false); put({state: "off", n, winner: o.tag.textContent + note}); info("🏆 " + o.tag.textContent); };
  $("q-ask").onclick = () => {
    q = str($("q-text").value, 80);
    if (!q) return info("문제를 적어 주세요.");
    if (!students().length) return info("교실에 들어온 학생이 없어요.");
    n++; setAsking(true); put({q, state: "ask", n, out: outMap(), left: alive().length}); info(`Q${n} 진행 중 · 남은 사람 ${alive().length}명 — 정답을 누르면 판정해요`);
  };
  const answer = ans => {
    if (!asking) return;
    const before = alive(), wrong = before.filter(([, o]) => sideOf(o) !== ans);
    const all = wrong.length === before.length;   // 전원 오답이면 탈락 없이 계속
    if (!all) for (const [id] of wrong) out.add(id);
    const left = alive();
    setAsking(false); $("q-text").value = "";
    if (left.length === 1 && before.length > 1) return win(left[0][1], " (최후의 1인)");
    put({q, state: "reveal", ans, n, out: outMap(), left: left.length});
    info(all ? "전원 오답! 탈락 없이 계속해요" : `${wrong.length}명 탈락 · 남은 사람 ${left.length}명`);
  };
  $("q-o").onclick = () => answer("O"); $("q-x").onclick = () => answer("X");
  const draw = (list, note) => list.length ? win(list[Math.random() * list.length | 0][1], note) : info("교실에 들어온 학생이 없어요.");
  $("q-draw").onclick = () => n ? draw(alive(), ` (남은 ${alive().length}명 중 추첨)`) : info("먼저 문제를 내 주세요.");
  $("q-pick").onclick = () => draw(students(), "");
  $("q-end").onclick = () => { out.clear(); n = 0; setAsking(false); db.remove(R("quiz")).catch(() => {}); info(""); };
}

// 실시간 동기화 — 주소에 교실 코드(?room=)가 있을 때만 연결. 창을 닫으면 내 기록은 자동 삭제됨
// 보안: 기기마다 익명 로그인 → 자기 기록(players/내 uid)만 쓸 수 있고, 로그인 없이는 읽지도 못함(DB 규칙)
if (ROOM) (async () => {
  try {
    const {db, au, auth, d} = await fb();
    const uid = (auth.currentUser || (await au.signInAnonymously(auth)).user).uid;   // 선생님이 로그인한 채로 열면 그 계정 그대로
    if (me) { players.delete(myId); players.set(uid, me); }
    myId = uid;
    const R = p => db.ref(d, `rooms/${ROOM}/${p}`);
    const owner = (await db.get(R("owner"))).val();
    if (!owner) { $("online").textContent = "없는 교실 주소예요. 선생님께 다시 확인해 주세요."; return; }
    // 선생님 설정(공개)과 반 이름
    let pub = null, cls = "";
    db.onValue(db.ref(d, "pub/" + owner), s => { pub = s.val(); applySettings(pub, cls); });
    db.onValue(R("cls"), s => { cls = s.val() || ""; applySettings(pub, cls); });
    db.onValue(R("quiz"), s => applyQuiz(s.val()));
    db.onValue(R("lesson"), s => { document.body.classList.toggle("lesson", s.val() === true); fitRoom(); });   // 수업 시작 → 칠판만
    if (uid === owner) { $("sidecol").hidden = false; teacherTools(db, R); }   // 칠판 옆 QR은 이 반 선생님 화면(프로젝터·전자칠판)에만. 학생 태블릿에는 안 보임
    const all = R("players"), mine = db.child(all, myId), quiet = p => p.catch(() => {});
    const state = () => ({x: Math.round(me.gx), y: Math.round(me.gy), seat: me.seat});
    let sent = "", open = true;
    db.onChildAdded(all, s => s.key !== myId && upsert(s.key, s.val()));
    db.onChildChanged(all, s => s.key !== myId && upsert(s.key, s.val()));
    db.onChildRemoved(all, s => s.key !== myId && drop(s.key));
    // 선생님 자리배치 (번호만 들어 있음)
    db.onValue(R("plan"), s => {
      const v = s.val() || {}, seats = v.seats || {};
      plan = {G: clamp(Math.round(+v.G) || 0, 0, 7), seats: Array.from({length: 42}, (_, i) => clamp(Math.round(+seats[i]) || 0, 0, 99))};
      layout();
    });
    net = {put() { if (me && open) { quiet(db.onDisconnect(mine).remove()); quiet(db.set(mine, {...profile, ...state()})); } }};
    // 선생님이 교실 문을 닫으면 아무도 기록을 쓸 수 없음(규칙에서도 막음) → 화면에 알리고 혼자 모드로
    db.onValue(R("gate/open"), s => {
      open = s.val() !== false;
      $("online").style.color = open ? "" : "#b0452f";
      if (open) { $("online").textContent = ""; count(); net.put(); } else $("online").textContent = "🚪 교실 문이 닫혀 있어요 (혼자 연습)";
    });
    db.onValue(db.ref(d, ".info/connected"), s => s.val() && net.put());
    // 페이지를 떠나면 바로 지우고(서버 감지는 1분쯤 걸림), 뒤로가기로 돌아오면 다시 등록
    addEventListener("pagehide", () => quiet(db.remove(mine)));
    addEventListener("pageshow", e => e.persisted && net.put());
    // 목적지가 바뀔 때만, 최대 초당 5번 전송 → 40명이어도 무료 한도 안에서 여유
    setInterval(() => { if (!me || !open) return; const v = state(), key = JSON.stringify(v); if (key !== sent) { sent = key; quiet(db.update(mine, v)); } }, 200);
  } catch (e) { console.warn("실시간 연결 실패 — 혼자 모드로 동작합니다", e); }
})();

</script>
</body>
</html>
